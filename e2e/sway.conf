# Host compositor for the e2e harness: a headless sway whose only job is to
# give the nested Hyprland's Wayland backend a GPU allocator (linux-dmabuf).
# No bar, no keybindings, no wallpaper; the default config is never read.
output HEADLESS-1 mode 1920x1080 position 0 0 bg #000000 solid_color
default_border none
